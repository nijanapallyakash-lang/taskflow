server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskflow}
    username: ${DB_USER:taskflow}
    password: ${DB_PASSWORD:taskflow}
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: none   # Flyway owns the schema
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
  jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  upload-dir: ${UPLOAD_DIR:uploads}
  mail-from: ${MAIL_FROM:no-reply@taskflow.local}
  admin-email: ${ADMIN_EMAIL:admin@taskflow.local}
  admin-password: ${ADMIN_PASSWORD:Admin@12345}
